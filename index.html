<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviewly</title>
    <!-- bootstrap css cdn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div id="divContent">
        <!-- landing page -->
        <nav class="navbar navbar-light bg-purple">
            <div class="container-fluid justify-content-between">
                <a class="navbar-brand text-white" style=" font-size:420%" href="#">Reviewly</a>
                <button class="btn btn-link text-white me-2 ms-auto" id="btnSelRegister" type="button">Register Here</button>
                <button class="btn btn-primary" id="btnSelLogin" type="button">Login</button>
            </div>
        </nav>
        <!-- instructor view -->
        <div style="background-color: var(--dark-blue);">
            <div class="row row-cols-4" style="padding-top:40px; padding-left:100px">
                <button class=" btn-hidden subheader">Scheduled</button>
                <button class="btn-hidden subheader">Current</button>
                <button class="btn-hidden subheader">Completed</button>
                <button class="btn-secondary subheader">+ New Survey</button>
            </div>
            <div >
                <form class="card  corner-round" style="padding:25px; padding-left:60px; width:80%;;">
                    <div class="row row-cols-2">
                        <h1 class="paragraph"> Mid Year Peer Review </h1>
                        <h1 class="paragraph text-justfy-left"> 64/120 completed </h1>
                        <h1 class="paragraph font-weight-light text-justfy-left"> CSC 1200-002 </h1>
                        <h1 class="paragraph font-weight-light text-justfy-left"> Ends Oct 28, 2025 </h1>

                    </div>
                </form>
            </div>
            
        </div>
        
    </div>

    <!-- bootstrap and sweetalert2 js cdn -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app.js"></script>
</body>

</html>
