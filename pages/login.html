<nav class="navbar position-fixed w-100 z-3">
    <div class="container-fluid justify-content-between">
        <a class="navbar-brand text-white ms-2" href="#">Reviewly</a>
        <button class="btn btn-link text-white me-2 ms-auto" id="btnSelRegister" type="button" onClick="location.hash='#/register'">Register Here</button>
        <button class="btn btn-primary me-2" id="btnSelLogin" type="button" onClick="location.hash='#/login'">Login</button>
    </div>
</nav>

<div class="d-flex justify-content-center align-items-center min-vh-100 custom-bg">
    <form class="card col-sm-9 col-md-6 col-lg-5 col-xl-4 shadow-lg" id="frmLogin">
        <div class="card-title text-center mt-4">
            <p class="fs-1 mb-0">Login</p>
        </div>
        <div class="card-body d-flex justify-content-center row">
            <div class="col-11">
                <label class="ms-2" for="txtEmail">Email:</label>
                <input class="form-control mt-1" type="email" id="txtEmail" autocomplete="username" aria-label="Input for email" required>
                <label class="ms-2 mt-2" for="txtPassword">Password:</label>
                <input class="form-control mt-1" type="password" id="txtPassword" autocomplete="current-password" aria-label="Input for password" required>
            </div>
            <div class="col-11 mt-5 text-center">
                <button class="btn btn-primary col-12 mb-4" type="button" id="btnLogin">Login</button>
            </div>
        </div>
    </form>
</div>
