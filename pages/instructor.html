<nav class="navbar">
    <div class="container-fluid justify-content-between">
        <a class="navbar-brand text-white ms-2" href="#">Reviewly</a>
        <button class="btn btn-primary me-2 ms-auto" type="button" id="btnInstructor" onClick="location.hash='#/instructor'">Instructor View</button>
        <button class="btn btn-primary unselected me-2" type="button" id="btnStudent" onClick="location.hash='#/student'">Student View</button>
        <button class="btn btn-primary unselected me-2" type="button" id="btnProfile" onclick="location.hash='#/profile'"> Profile</button>
    </div>
</nav>

<!-- Instructor view: Displays all groups created by the instructor -->
<div class="container-fluid" id="viewGroupsProf">
    <!-- Button to open the "Create Course" modal -->
    <div class="d-flex justify-content-end mt-3 me-2" id="divCreateCourseModal">
        <button class="btn btn-outline-primary" id="btnCreateCourseModal">
            Create Course
        </button>
    </div>

    <!-- Group cards container -->
    <div class="d-flex flex-wrap margin-30" id="groupContainer">
        
    </div>

    <!-- in-depth group view (surveys,students, etc) -->
    <div class="container-fluid d-none margin-30" id="viewGroupDetails" style="padding-right: 100px">
        <form class="card corner-round" id="frmSurvey" style="padding:15px; margin-top:70px;">
            <div class="row row-cols-2">
                <div class="col-4" id="surveyNav">
                    <!-- name of the group selected -->
                    <div style="padding:7px">
                        <h1 id="txtCourseTitle">CSC 2100-002</h1>
                    </div>
                    <div class="row row-cols-2 container-fluid" style="padding:30px">
                        <h3>Groups</h3>
                        <button class="btn btn-outline-primary" id="btnCreateGroupModal">
                            + New Group
                        </button>
                    </div>
                    <!--list of surveys avaliable to be viewed -->
                    <div class="row">
                        <div class="col container overflow-auto" id="divGroupContainer">
                            
                        </div>
                    </div>
                    <div class="row row-cols-2 container-fluid" style="padding:30px">
                        <h3>Surveys</h3>
                        <button class="btn btn-outline-primary" id="btnNewSurvey" type="button">+ New Survey</button>
                    </div>
                    <!--list of surveys avaliable to be viewed -->
                    <div class="row">
                        <div class="col container overflow-auto" id="divSurveyContainer">
                            
                        </div>
                    </div>
                </div>
                <!-- Survey details -->
                <div class="border-left col-8">
                    <div class="row">
                        <div class="col" id="divSurveyDetails">
                            <h2 class="text-center mt-4">Mid-Year Peer Review</h2>
                            <!-- Status table -->
                            <div style="padding: 20px">
                                <label for="selStudents" class="form-label text-white">Students</label>
                                <select id="selStudents" class="bg-dark text-white form-select" multiple>
                                    <option value="Harry">Harry Potter</option>
                                    <option value="Ron">Ron Weasley</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Create group modal -->
<div class="modal fade" id="createGroupModal" tabindex="-1" role="dialog" aria-labelledby="createGroupModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header">
                <h5 class="modal-title" id="createGroupModalLabel">Create A Group</h5>
                <button type="button" class="btn-close text-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label class="ms-2 mt-2" for="txtGroupName">Group Name:</label>
                <input class="form-control input-outline mt-1" type="text" id="txtGroupName"
                    aria-label="Input for group name" />
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Close
                </button>
                <button type="button" id="btnCreateGroup" class="btn btn-primary">Create</button>
            </div>
        </div>
    </div>
</div>

<!-- create course modal -->
<div class="modal fade" id="createCourseModal" tabindex="-1" role="dialog" aria-labelledby="createCourseModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header">
                <h5 class="modal-title" id="createCourseModalLabel">Create A Group</h5>
                <button type="button" class="btn-close text-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label class="ms-2 mt-2" for="txtCourseName">Course Name:</label>
                <input class="form-control input-outline mt-1" type="text" id="txtCourseName"
                    aria-label="Input for course name" placeholder="Software Engineering I">
                <label class="ms-2 mt-2" for="txtCourseNumber">Course Number:</label>
                <input class="form-control input-outline mt-1" type="text" id="txtCourseNumber"
                    aria-label="Input for course number" placeholder="CSC-4610">
                <label class="ms-2 mt-2" for="txtSectionNumber">Section Number:</label>
                <input class="form-control input-outline mt-1" type="text" id="txtSectionNumber"
                    aria-label="Input for section number" placeholder="001">
                <label class="ms-2 mt-2" for="txtSemester">Semester:</label>
                <input class="form-control input-outline mt-1" type="text" id="txtSemester"
                    aria-label="Input for semester" placeholder="Spring 2025">
                <label class="ms-2 mt-2" for="txtStartDate">Start Date (MM/DD/YY):</label>
                <input class="form-control input-outline mt-1" type="date" id="txtStartDate"
                    aria-label="Input for course start date">
                <label class="ms-2 mt-2" for="txtEndDate">End Date (MM/DD/YY):</label>
                <input class="form-control input-outline mt-1" type="date" id="txtEndDate"
                    aria-label="Input for course end date">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" id="btnCreateCourse" class="btn btn-primary">Create</button>
            </div>
        </div>
    </div>
</div>

<div id="divCreateNewSurvey">
    
</div>
