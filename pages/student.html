<nav class="navbar">
    <div class="container-fluid justify-content-between">
        <a class="navbar-brand text-white ms-2" href="#">Reviewly</a>
        <button class="btn btn-primary unselected me-2 ms-auto" type="button" id="btnInstructor" onClick="location.hash='#/instructor'">Instructor View</button>
        <button class="btn btn-primary me-2" type="button" id="btnStudent" onClick="location.hash='#/student'">Student View</button>
        <button class="btn btn-primary unselected me-2" type="button" id="btnProfile" onclick="location.hash='#/profile'"> Profile</button>
    </div>
</nav>

<!-- Container for viewing all groups -->
<div class="container-fluid" id="viewGroups">
    <!-- Button to open the "Join Group" modal -->
    <div class="d-flex justify-content-end mt-3 me-2">
        <button class="btn btn-outline-primary" id="btnJoinGroupModal">
            Join Group
        </button>
    </div>

    <!-- Group cards container -->
    <div class="d-flex flex-wrap margin-30" id="groupContainer">
        <!-- Example group card -->
        <div class="card shadow p-4 group-card selection-card position-relative me-2">
            <h3>GROUP NAME</h3>
            <p>COURSE NAME</p>
            <a class="stretched-link" data-group-id="Group1"></a>
        </div>
        <!-- Repeatable group card -->
        <div class="card shadow p-4 group-card selection-card position-relative me-2">
            <h3>GROUP NAME</h3>
            <p>COURSE NAME</p>
            <a class="stretched-link" data-group-id="Group2"></a>
        </div>
        <div class="card shadow p-4 group-card selection-card position-relative me-2">
            <h3>GROUP NAME</h3>
            <p>COURSE NAME</p>
            <a class="stretched-link" data-group-id="Group3"></a>
        </div>
    </div>
</div>

<!-- Section for viewing a selected group -->
<div class="container-fluid d-none" id="selectedGroup">
    <!-- Group name header -->
    <h1 class="margin-30 text-white mt-3 mb-5" id="groupName"></h1>
    <!-- Buttons to navigate between surveys, members, and feedback -->
    <div class="margin-30" id="viewOptions">
        <div class="d-flex justify-content-start row row-cols-6 mt-4">
            <button class="btn btn-primary me-2" id="btnSurveys">
                Surveys
            </button>
            <button class="btn btn-primary unselected me-2" id="btnMembers">
                Group Members
            </button>
            <button class="btn btn-primary unselected" id="btnFeedback">
                Feedback
            </button>
        </div>
    </div>
</div>

<!-- Section for viewing all surveys -->
<div class="container-fluid d-none" id="viewSurveys">
    <div class="margin-30">
        <div class="row mt-5" id="surveyContainer">
            <!-- Example survey card -->
            <div class="card selection-card shadow-sm mb-2 position-relative">
                <div class="card-body">
                    <p>Mid-Year Peer Review</p>
                    <p>CSC 4610-002</p>
                    <a class="stretched-link" data-survey-id="Survey1"></a>
                </div>
            </div>
            <!-- Repeatable survey card -->
            <div class="card selection-card shadow-sm mb-2 position-relative">
                <div class="card-body">
                    <p>End-Year Peer Review</p>
                    <p>CSC 4610-002</p>
                    <a class="stretched-link" data-survey-id="Survey2"></a>
                </div>
            </div>
        </div>
    </div>
    <!-- Back button -->
    <button class="btn btn-secondary position-fixed" id="btnBackToGroups">Back</button>
</div>

<!-- Section for displaying a sample survey -->
<div class="d-flex justify-content-center align-items-center d-none" id="frmSurvey">
    
</div>

<!-- Section for viewing all group members -->
<div class="container-fluid d-none" id="viewMembers">
    <div class="margin-30">
        <div class="row mt-5" id="groupMemberContainer">
        </div>
    </div>
</div>

<!-- Section for viewing all feedback -->
<div class="container-fluid d-none" id="viewFeedback">
    <div class="margin-30">
        <div class="row mt-5" id="surveyFeedbackContainer">
            <!-- Example feedback card -->
            <div class="card selection-card shadow-sm mb-2 position-relative">
                <div class="card-body">
                    <p>SURVEY NAME</p>
                    <p>STUDENT 1</p>
                    <a class="stretched-link" data-survey-id="Survey1"></a>
                </div>
            </div>
            <!-- Repeatable feedback card -->
            <div class="card selection-card shadow-sm mb-2 position-relative">
                <div class="card-body">
                    <p>SURVEY NAME</p>
                    <p>STUDENT 2</p>
                    <a class="stretched-link" data-survey-id="Survey2"></a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal for joining a group -->
<div class="modal fade" id="joinGroupModal" tabindex="-1" role="dialog" aria-labelledby="joinGroupModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content bg-dark text-white">
            <!-- Modal header -->
            <div class="modal-header">
                <h5 class="modal-title" id="joinGroupModalLabel">Join A Group</h5>
                <button type="button" class="btn-close text-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                <label class="ms-2 mt-2" for="txtJoinGroupModal">Enter Group Code:</label>
                <input class="form-control input-outline mt-1" type="text" id="txtJoinGroupModal"
                    aria-label="Input for group code" />
            </div>
            <!-- Modal footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Close
                </button>
                <button type="button" class="btn btn-primary">Join</button>
            </div>
        </div>
    </div>
</div>
