<nav class="navbar">
    <div class="container-fluid justify-content-between">
        <a class="navbar-brand text-white ms-2" href="#">Reviewly</a>
        <button class="btn btn-primary me-2 ms-auto" type="button" id="btnInstructor" onClick="location.hash='#/instructor'">Instructor View</button>
        <button class="btn btn-primary unselected me-2" type="button" id="btnStudent" onClick="location.hash='#/student'">Student View</button>
        <button class="btn btn-primary unselected me-2" type="button" id="btnProfile" onclick="location.hash='#/profile'"> Profile</button>
    </div>
</nav>

<!-- Main container for the "Create New Survey" page -->
<div class="container-fluid" id="divHome">
    <div class="d-flex justify-content-center align-items-center margin-30 mt-5">
        <!-- Form for creating a new survey -->
        <form class="card bgpurple" style="padding: 30px;" id="frmHome">
            <div class="card-body">
                <!-- Header displaying the class and section name -->
                <h1 class="text-center mb-4" style="color: white">
                    Class Name (Section Name)
                </h1>
        
                <div id="divSurveys" class="card col-12 text-dark mb-4" style="background-color: #FFE58A; padding: 20px;">
                    <h1 id="surveyTitle" class="text-center">
                        Survey Title
                    </h1>
                </div>
        
                <!-- Input field for adding a survey title -->
                <div class="d-flex flex-column align-items-start mt-2" style="gap: 5px; width: 100%;">
                    <label for="txtSurveyTitle" class="mb-0" style="color: white">Survey Title:</label>
                    <input id="txtSurveyTitle" class="form-control" type="text" placeholder="Survey Title"
                        aria-label="Input for Survey Title" required style="width: 100%" />
                </div>
                <div class="d-flex justify-content-start mt-2" style="width: 100%;">
                    <button id="btnAddTitle" class="btn btn-secondary" type="button" style="background-color: transparent; color: white; border: 1px solid white;"
                        onmouseover="this.style.backgroundColor='#BF3475'; this.style.color='white';"
                        onmouseout="this.style.backgroundColor='transparent'; this.style.color='white';">
                        Add Title
                    </button>
                </div>
        
                <!-- Dropdown for selecting a question type -->
                <div class="d-flex flex-column align-items-start mt-3" style="gap: 5px; width: 100%;">
                    <label for="cboQuestion" class="mb-0" style="color: white">Add A Question:</label>
                    <select id="cboQuestion" class="form-control" placeholder="Question" aria-label="Add a question"
                        style="width: 100%">
                        <option value="">Select Question Type</option>
                        <option value="multiple choice">Multiple Choice</option>
                        <option value="likert scale">Likert Scale</option>
                        <option value="short answer">Short Answer</option>
                    </select>
                </div>
                <div class="d-flex justify-content-start mt-2" style="width: 100%;">
                    <button id="btnCreateNewQuestion" class="btn btn-secondary" type="button" style="background-color: transparent; color: white; border: 1px solid white;" 
                        onmouseover="this.style.backgroundColor='#BF3475'; this.style.color='white';"
                        onmouseout="this.style.backgroundColor='transparent'; this.style.color='white';">
                        Create Question
                    </button>
                </div>
        
                <!-- Container for dynamically creating questions -->
                <div id="divCreateQuestion" style="width: 100%; margin-top: 20px"></div>

                <label class="ms-2 mt-2" for="txtStartDate">Start Date (MM/DD/YY):</label>
                <input class="form-control mt-1" type="date" id="txtStartDate" aria-label="Input for course start date">
                <label class="ms-2 mt-2" for="txtEndDate">End Date (MM/DD/YY):</label>
                <input class="form-control mt-1" type="date" id="txtEndDate" aria-label="Input for course end date">
        
                <!-- Buttons at the bottom of the card -->
                <div class="d-flex justify-content-center align-items-center mt-4" style="gap: 10px; width: 100%;">
                    <!-- Create Survey Button -->
                    <button id="btnCreateSurvey" class="btn btn-secondary col-lg-5" type="button" style="background-color: transparent; color: white; border: 1px solid white;" 
                        onmouseover="this.style.backgroundColor='#BF3475'; this.style.color='white';"
                        onmouseout="this.style.backgroundColor='transparent'; this.style.color='white';">
                        Create Survey
                    </button>
        
                    <!-- Return to Class Button -->
                    <button id="btnReturnToClass" class="btn btn-secondary col-lg-5" type="button" style="background-color: transparent; color: white; border: 1px solid white;" 
                        onmouseover="this.style.backgroundColor='#BF3475'; this.style.color='white';"
                        onmouseout="this.style.backgroundColor='transparent'; this.style.color='white';">
                        Return To Class
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
